experiment: "deepgaze_iie_finetune_augsal"
output_dir: "outputs/finetune_augsal/deepgaze_iie"
seed: 1337

data:
  root: "AugSal/augmented_data"
  cv_folds: 2
  cv_fold_index: null
  cv_shuffle: true
  shuffle: true
  sigma_px: 15
  batch_size: 1
  num_workers: 0
  gt_aggregate: "mean"
  gt_resize_interp: "bilinear"
  gt_cache_dir: null
  include_list: null
  exclude_list: null
  allow_uniform_gt: false

model:
  centerbias_path: "data/centerbias/centerbias_mit1003.npy"
  use_uniform_centerbias: true
  device: "cuda"

training:
  progress: true
  loss: "kl"
  stages:
    - name: "feature_extraction"
      save_best_only: true
      epochs: 15
      lr: 0.0001
      weight_decay: 0.0
      freeze:
        mode: "train_blocks"
        blocks: ["saliency", "finalizer"]
      train_features: false

    - name: "fine_tune"
      save_best_only: true
      epochs: 10
      lr: 0.00001
      weight_decay: 0.0
      freeze:
        mode: "train_blocks"
        blocks: ["head"]
        backbone_last_n_modules: 0
      train_features: false

wandb:
  enabled: false
  project: null
  entity: null
  name: null
  group: null
  tags: ["deepgaze", "finetune", "augsal"]
  notes: "Fine-tuning on AugSal-generated dataset"
  dir: null
  mode: null
