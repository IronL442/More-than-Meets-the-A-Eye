input:
  # Point this to your Kaggle input dataset mount.
  image_dir: "/kaggle/input/datasets/lauritseisengarten/seminar-data/seminar_data/images"
  gt_mean_dir: "/kaggle/input/datasets/lauritseisengarten/seminar-data/seminar_data/gt_maps_mean"
  captions_json: "/kaggle/input/datasets/lauritseisengarten/seminar-data/seminar_data/image_captions.json"
  # Recommended: provide a train-only list to avoid test leakage.
  include_list: null
  exclude_list: null

output:
  root: "/kaggle/working/AugSal/augmented_data_diffusers_lowmem"
  images_subdir: "images"
  gt_subdir: "gt_maps"
  metadata_csv: "metadata.csv"
  metadata_jsonl: "metadata.jsonl"
  copy_originals: true
  save_change_maps: true
  change_maps_subdir: "change_maps"
  overwrite: true

generation:
  backend: "diffusers_img2img"
  seed: 1337
  num_augs_per_image: 1
  image_ext: ".jpg"
  jpg_quality: 95

  opencv:
    max_rotation_deg: 15.0
    max_shift_ratio: 0.04
    min_scale: 0.95
    max_scale: 1.05
    perspective_prob: 0.35
    perspective_jitter_ratio: 0.03
    brightness_delta: 20.0
    contrast_delta: 0.18
    saturation_delta: 0.15
    noise_std: 3.0

  diffusers:
    # SD-Turbo is lighter than SDXL-Turbo and generally more stable for parallel Kaggle T4 runs.
    model_id: "stabilityai/sd-turbo"
    device: "cuda"
    torch_dtype: "float16"
    strength: 0.30
    guidance_scale: 0.0
    num_inference_steps: 6
    use_safetensors: true
    cross_attention:
      enabled: false
      map_hw: [64, 64]
      layer_name_contains: "attn2"
      include_special_tokens: false
      max_token_maps: 77

prompting:
  negative_prompt: "extra people, duplicated limbs, text overlays, logos, watermarks, cartoon style, surreal artifacts"

pseudo_label:
  diff_weight: 0.35
  change_blur_ksize: 17
  change_blur_sigma: 3.0
  min_change_threshold: 2.0
  change_floor: 1.0e-6
  smooth_ksize: 9
  smooth_sigma: 2.0

cross_attention:
  enabled: false
  use_for_pseudo_label: false
  blend_weight: 0.5
  min_token_chars: 2
  save_selected_maps: false
  selected_maps_subdir: "selected_attention_maps"

runtime:
  max_images: null
  shard_index: 0
  num_shards: 1
  progress: true
