input:
  image_dir: "data/seminar_data/images"
  gt_mean_dir: "data/seminar_data/gt_maps_mean"
  captions_json: "data/seminar_data/image_captions.json"
  include_list: "splits/trainval.txt"
  exclude_list: null

output:
  root: "AugSal/augmented_data"
  images_subdir: "images"
  gt_subdir: "gt_maps"
  metadata_csv: "metadata.csv"
  metadata_jsonl: "metadata.jsonl"
  copy_originals: false
  save_change_maps: true
  change_maps_subdir: "change_maps"
  overwrite: true

generation:
  backend: "opencv_caption_style"
  seed: 1337
  num_augs_per_image: 1
  image_ext: ".jpg"
  jpg_quality: 95

  # Used when generation.backend == opencv_caption_style
  opencv:
    max_rotation_deg: 15.0
    max_shift_ratio: 0.04
    min_scale: 0.95
    max_scale: 1.05
    perspective_prob: 0.35
    perspective_jitter_ratio: 0.03
    #brightness_delta: 20.0
    #contrast_delta: 0.18
    #saturation_delta: 0.15
    #noise_std: 3.0
    #saliency_only: true
    #saliency_min: 0.15
    #saliency_gamma: 1.25
    #saliency_blur_ksize: 31
    #saliency_blend: 1.0

    # Presets (copy values above):
    # mild:
    # brightness_delta: 15.0
    # contrast_delta: 0.12
    # saturation_delta: 0.10
    # noise_std: 2.0
    # saliency_min: 0.20
    # saliency_gamma: 1.40
    # saliency_blur_ksize: 25
    # saliency_blend: 0.80
    # Balanced preset for finetuning: moderate visual edits, stable saliency-local mask.
    brightness_delta: 15.0
    contrast_delta: 0.18
    saturation_delta: 0.15
    noise_std: 2.5
    saliency_min: 0.20
    saliency_gamma: 1.10
    saliency_blur_ksize: 25
    saliency_blend: 0.85

  # Used when generation.backend == diffusers_img2img
  diffusers:
    model_id: "stabilityai/sdxl-turbo"
    device: "auto"
    torch_dtype: "float16"
    strength: 0.35
    guidance_scale: 5.0
    num_inference_steps: 20
    use_safetensors: true

pseudo_label:
  # Balanced preset for finetuning: avoid over-sharpened pseudo maps.
  diff_weight: 0.12
  change_blur_ksize: 17
  change_blur_sigma: 3.0
  min_change_threshold: 2.0
  change_floor: 1.0e-6
  salient_boost_weight: 0.0
  salient_boost_power: 1.4
  smooth_ksize: 9
  smooth_sigma: 2.0


cross_attention:
  enabled: false
  use_for_pseudo_label: true
  blend_weight: 0.5
  min_token_chars: 2
  save_selected_maps: false
  selected_maps_subdir: "selected_attention_maps"

runtime:
  max_images: null
  shard_index: 0
  num_shards: 1
  progress: true
