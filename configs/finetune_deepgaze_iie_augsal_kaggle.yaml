experiment: "deepgaze_iie_finetune_augsal_kaggle"
output_dir: "/kaggle/working/outputs/finetune_augsal/deepgaze_iie"
seed: 1337

data:
  # AugSal output root containing {images, gt_maps}.
  root: "/kaggle/input/augmented-data/augmented_data"
  cv_folds: 4
  cv_fold_index: null
  cv_shuffle: true
  shuffle: true
  sigma_px: 15
  batch_size: 1
  num_workers: 2
  gt_aggregate: "mean"
  gt_resize_interp: "bilinear"
  gt_cache_dir: null
  include_list: null
  exclude_list: null
  allow_uniform_gt: false

model:
  centerbias_path: "data/centerbias/centerbias_mit1003.npy"
  use_uniform_centerbias: true
  device: "cuda"

determinism:
  enabled: true
  use_deterministic_algorithms: true
  warn_only: true
  cudnn_deterministic: true
  cudnn_benchmark: false
  cublas_workspace_config: ":4096:8"
  dataloader_seed_offset: 1000

training:
  progress: true
  loss: "kl"
  stages:
    - name: "feature_extraction"
      save_best_only: true
      epochs: 15
      lr: 0.0001
      weight_decay: 0.0
      freeze:
        mode: "train_blocks"
        blocks: ["saliency", "finalizer"]
      train_features: false

    - name: "fine_tune"
      save_best_only: true
      epochs: 10
      lr: 0.00001
      weight_decay: 0.0
      freeze:
        mode: "train_blocks"
        blocks: ["head"]
        backbone_last_n_modules: 0
      train_features: false

wandb:
  enabled: true
  project: "deepgaze-iie-saliency"
  entity: null
  name: "finetuned-augsal"
  group: "finetune-vs-baseline"
  tags: ["deepgaze", "finetune", "cv", "augsal"]
  notes: "4-fold CV fine-tuning on AugSal augmented_data (images + pseudo gt_maps)"
  dir: "/kaggle/working/wandb_logs"
  mode: "online"
