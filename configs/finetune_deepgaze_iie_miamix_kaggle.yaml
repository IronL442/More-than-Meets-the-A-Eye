experiment: "deepgaze_iie_finetune_miamix_kaggle"
output_dir: "/kaggle/working/outputs/finetune_miamix/deepgaze_iie"
seed: 1337

data:
  # Expects MiaMix/augmented_images/{images,gt_maps} where gt_maps are .npy files.
  # Generate gt_maps via MiaMix/MiaMix.py (it now saves finetune-ready .npy maps).
  root: "/kaggle/input/miamix/MiaMix/augmented_images"
  cv_folds: 4          # >= 2 enables CV
  cv_fold_index: null  # set to 0..3 to run a single fold
  cv_shuffle: true     # optional, defaults to data.shuffle
  shuffle: true
  sigma_px: 15
  batch_size: 1
  num_workers: 2
  gt_aggregate: "mean"
  gt_resize_interp: "bilinear"
  # Optional cache dir for precomputed mean GT maps. Set null to compute on the fly.
  gt_cache_dir: null
  exclude_list: null
  allow_uniform_gt: false

model:
  centerbias_path: "data/centerbias/centerbias_mit1003.npy"
  use_uniform_centerbias: true
  device: "cuda"

training:
  progress: true
  loss: "kl"
  stages:
    - name: "feature_extraction"
      save_best_only: true
      epochs: 15
      lr: 0.0001
      weight_decay: 0.0
      freeze:
        mode: "train_blocks"
        blocks: ["saliency", "finalizer"]
      train_features: false

    - name: "fine_tune"
      save_best_only: true
      epochs: 10
      lr: 0.00001
      weight_decay: 0.0
      freeze:
        mode: "train_blocks"
        blocks: ["head"]
        backbone_last_n_modules: 0
      train_features: false

wandb:
  enabled: true
  project: "deepgaze-iie-saliency"
  entity: null
  name: "finetuned-miamix"
  group: "finetune-vs-baseline"
  tags: ["deepgaze", "finetune", "cv", "miamix"]
  notes: "4-fold CV fine-tuning on MiAMix augmented_images (images + gt_maps)"
  dir: "/kaggle/working/wandb_logs"
  mode: "online"
