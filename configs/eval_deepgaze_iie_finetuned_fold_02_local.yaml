experiment: "eval_deepgaze_iie_finetuned_fold_02_local"
output_dir: "outputs/non_augmented/eval/deepgaze_iie_finetuned_fold_02"
prediction_cache_dir: "outputs/non_augmented/predictions/fold_02"
cache_predictions: false
predict_only: false

models:
  - "deepgaze_iie"

active_models:
  - "deepgaze_iie"

model_kwargs:
  deepgaze_iie:
    use_uniform_centerbias: true
    weights_path: "outputs/finetune/deepgaze_iie/fold_02/final.pth"

datasets:
  - name: "folder"
    root: "data/seminar_data"
    split: "test"
    include_list: "splits/test.txt"
    gt_subdir: "gt_maps_mean"

heatmaps_png:
  enabled: true
  overlay: true
  normalize: "max"
  colormap: "jet"
  alpha: 0.5
  out_dir: "outputs/non_augmented/heatmaps/fold_02"
