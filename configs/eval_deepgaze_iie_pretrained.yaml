experiment: "eval_deepgaze_iie_pretrained"
output_dir: "outputs/non_augmented/eval/deepgaze_iie_pretrained"
prediction_cache_dir: "outputs/non_augmented/predictions/pretrained"
cache_predictions: false
predict_only: false

models:
  - "deepgaze_iie"

active_models:
  - "deepgaze_iie"

model_kwargs:
  deepgaze_iie:
    use_uniform_centerbias: true
    pretrained: true

datasets:
  - name: "folder"
    root: "data/seminar_data"
    split: "test"
    include_list: "splits/test.txt"
    gt_subdir: "gt_maps_mean"

heatmaps_png:
  enabled: true
  overlay: true
  normalize: "sum"
  colormap: "jet"
  alpha: 0.5
  out_dir: "outputs/non_augmented/heatmaps/pretrained"
